# Camera QC default tolerances.
#
# Chessboard preset is seeded from sensor_color_comparison_postccm.ipynb
# section 9: the |Δ| after CCM between the corrected new sensor and the
# old sensor, expressed as % of the old-sensor reference mean. Those
# numbers describe "a new sensor we already accepted as good enough".
#
# Ceiling preset is seeded at chessboard * 2 — ceiling scenes have more
# uncontrolled content (occupancy, daylight) and need looser bands.
# Tune both presets in M6 against ≥10 known-good DUT batches.
#
# Tolerance semantics (whether a metric is "outside tolerance"):
#   higher_better metrics  → outside if dut < ref - tol_pct%
#   lower_better metrics   → outside if dut > ref + tol_pct%
#   closer_to_ref metrics  → outside if |dut - ref| > tol_pct%   (% of |ref|)
#
# Severity decides what "outside tolerance" *costs*:
#   blocking  → drives the pass/marginal/fail verdict (optics: sharpness, noise)
#   advisory  → never fails the unit; reported and highlighted as a warning
#               (colour/exposure: L, a*, b*, R, G, B). Colour differences are
#               correctable downstream (CCM / white balance), so they are not
#               grounds for rejecting a module.

metric_direction:
  L: closer_to_ref
  "a*": closer_to_ref
  "b*": closer_to_ref
  R: closer_to_ref
  G: closer_to_ref
  B: closer_to_ref
  sharpness: higher_better
  noise: lower_better
  sharpness_fft: higher_better

metric_severity:
  L: advisory
  "a*": advisory
  "b*": advisory
  R: advisory
  G: advisory
  B: advisory
  sharpness: blocking
  noise: blocking
  sharpness_fft: blocking

scenes:
  chessboard:
    min_dut_images: 1
    tolerances_pct:
      L: 10
      "a*": 7
      "b*": 12
      R: 10
      G: 10
      B: 7
      sharpness: 10       # strict: DUT sharpness must be >= 90% of ref
      sharpness_fft: 10   # strict: DUT sharpness_fft must be >= 90% of ref
      noise: 0            # strict: DUT noise must not exceed ref
  ceiling:
    min_dut_images: 3
    tolerances_pct:
      L: 20
      "a*": 14
      "b*": 24
      R: 20
      G: 20
      B: 14
      sharpness: 10       # same strict floor as chessboard
      sharpness_fft: 10
      noise: 0

verdict:
  # Counted over BLOCKING metrics only. Advisory metrics never change the
  # verdict, however far outside tolerance they land.
  #
  # At the defaults below any single blocking metric outside tolerance is a
  # FAIL, so MARGINAL is unreachable. To reinstate the softer ladder, set
  # fail_if_n_blocking_outside_tol: 2 — one blocking metric off then reads
  # MARGINAL and two or more read FAIL.
  fail_if_n_blocking_outside_tol: 1
  marginal_if_n_blocking_outside_tol: 1
  aggregation: median   # median | mean | worst_case (across N DUT images)
