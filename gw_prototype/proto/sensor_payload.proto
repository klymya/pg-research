syntax = "proto3";

package telemetrypayload;

message ReportingObject {
    uint32 position_x = 1;
    uint32 position_y = 2;
    uint32 box_x = 3;
    uint32 box_y = 4;
    uint32 box_w = 5;
    uint32 box_h = 6;
    float confidence = 7;
}

message Notification {
    uint32 timestamp = 2;
    repeated ReportingObject objects = 3;
}
