syntax = "proto3";

package telemetrypayload;

message ReportingObject {
    uint32 position_x = 1;
    uint32 position_y = 2;
    uint32 box_x = 3;
    uint32 box_y = 4;
    uint32 box_w = 5;
    uint32 box_h = 6;
    float confidence = 7;
}

message TelemetryNotification {
    uint32 timestamp = 2;
    repeated ReportingObject objects = 3;
}

message XYObject {
    int32 x = 1;
    int32 y = 2;
}

message XYNotification {
    uint32 timestamp = 1;
    repeated XYObject objects = 2;
}

message AoICountObject {
    string aoi_id = 1;
    uint32 count = 2;
}

message AoICountNotification {
    uint32 timestamp = 1;
    repeated AoICountObject objects = 2;
}